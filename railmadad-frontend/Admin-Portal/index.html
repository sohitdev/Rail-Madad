<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Rail Madad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

<div class="flex">
  <aside class="w-64 bg-blue-900 text-white min-h-screen p-6">
    <h1 class="text-2xl font-bold mb-12 text-center">Rail Madad Admin</h1>
    <nav class="space-y-4">
      <a href="#dashboard" class="block hover:text-yellow-300 text-center">Dashboard</a>
      <a href="#complaints" class="block hover:text-yellow-300 text-center">Complaints</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <section id="dashboard" class="mb-10">
      <h2 class="text-2xl font-semibold mb-4">Overview</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-4 rounded shadow text-center">
          <h3 class="text-gray-600">Total Complaints</h3>
          <p id="total-count" class="text-2xl font-bold text-blue-700">0</p>
        </div>
        <div class="bg-white p-4 rounded shadow text-center">
          <h3 class="text-gray-600">Resolved</h3>
          <p id="resolved-count" class="text-2xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white p-4 rounded shadow text-center">
          <h3 class="text-gray-600">Pending/In Progress</h3>
          <p id="pending-count" class="text-2xl font-bold text-red-500">0</p>
        </div>
      </div>
    </section>

    <section id="complaints">
      <h2 class="text-2xl font-semibold mb-4">Complaints</h2>

      <div class="mb-6 flex flex-wrap items-center gap-4">
        <label for="departmentFilter" class="font-medium">Department:</label>
        <select id="departmentFilter" class="p-2 border border-gray-300 rounded min-w-64">
          <option value="">All</option>
        </select>

        <label for="statusFilter" class="font-medium">Status:</label>
        <select id="statusFilter" class="p-2 border border-gray-300 rounded">
          <option value="">All</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>

        <button id="applyFiltersBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Apply</button>
        <button id="resetFiltersBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Reset</button>
      </div>

      <div id="complaints-list" class="space-y-6"></div>
    </section>
  </main>
</div>

<script>
const API_BASE = 'http://localhost:3000';

const complaintsContainer = document.getElementById('complaints-list');
const departmentFilter = document.getElementById('departmentFilter');
const statusFilter = document.getElementById('statusFilter');
const applyFiltersBtn = document.getElementById('applyFiltersBtn');
const resetFiltersBtn = document.getElementById('resetFiltersBtn');
const AUTO_REFRESH_MS = 10000;
let autoRefreshTimer = null;

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function statusBadgeClass(status) {
  if (status === 'Resolved') return 'bg-green-100 text-green-800';
  if (status === 'In Progress') return 'bg-blue-100 text-blue-800';
  return 'bg-yellow-100 text-yellow-800';
}

function getFileDisplay(c) {
  const fileExt = c.file_path ? c.file_path.split('.').pop().toLowerCase() : '';
  const fileUrl = c.file_path ? `${API_BASE}/uploads/${c.file_path}` : '';

  if (!fileUrl) {
    return '<p class="text-sm text-gray-500">No file attached</p>';
  }

  if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(fileExt)) {
    return `<img src="${fileUrl}" alt="Attachment" class="w-40 h-32 object-cover rounded border" />`;
  }
  if (['mp4', 'webm', 'ogg'].includes(fileExt)) {
    return `<video controls class="w-48 rounded"><source src="${fileUrl}" type="video/${fileExt}"></video>`;
  }
  if (['mp3', 'wav', 'm4a'].includes(fileExt)) {
    return `<audio controls class="w-48"><source src="${fileUrl}"></audio>`;
  }

  return `<a href="${fileUrl}" target="_blank" class="text-blue-600 underline text-sm">Download file</a>`;
}

async function loadDepartments() {
  try {
    const res = await fetch(`${API_BASE}/meta/departments`);
    const result = await res.json();

    if (!res.ok || !result.success || !Array.isArray(result.data)) {
      return;
    }

    const options = ['<option value="">All</option>']
      .concat(result.data.map((dept) => `<option value="${escapeHtml(dept)}">${escapeHtml(dept)}</option>`));

    departmentFilter.innerHTML = options.join('');
  } catch (error) {
    console.error('Failed to load departments:', error);
  }
}

async function loadComplaints() {
  try {
    complaintsContainer.innerHTML = '<p class="text-gray-600">Loading complaints...</p>';

    const params = new URLSearchParams();
    if (departmentFilter.value) params.set('department', departmentFilter.value);
    if (statusFilter.value) params.set('status', statusFilter.value);

    const url = `${API_BASE}/admin/complaints${params.toString() ? `?${params.toString()}` : ''}`;
    const res = await fetch(url);
    const result = await res.json();

    if (!res.ok || !result.success) {
      complaintsContainer.innerHTML = `<p class="text-red-500">${escapeHtml(result.message || 'Failed to load complaints')}</p>`;
      return;
    }

    const complaints = result.data || [];
    complaintsContainer.innerHTML = '';

    if (!complaints.length) {
      complaintsContainer.innerHTML = '<p class="text-red-500">No complaints found for selected filters.</p>';
      return;
    }

    complaints.forEach((c) => {
      const card = `
        <div class="bg-white shadow rounded p-6" id="complaint-${c.id}">
          <div class="flex justify-between items-center mb-3">
            <div>
              <h3 class="font-bold text-lg">Complaint #${c.id}</h3>
              <p class="text-sm text-gray-600">Filed: ${new Date(c.created_at).toLocaleString()}</p>
            </div>
            <span class="px-3 py-1 text-sm rounded-full ${statusBadgeClass(c.status)}">${escapeHtml(c.status || 'Pending')}</span>
          </div>

          <p><strong>Mobile:</strong> ${escapeHtml(c.mobile_number)}</p>
          <p><strong>PNR:</strong> ${escapeHtml(c.pnr_number || 'N/A')}</p>
          <p><strong>Station:</strong> ${escapeHtml(c.recent_station || 'N/A')}</p>
          <p><strong>Department:</strong> ${escapeHtml(c.department || 'General')}</p>
          <p><strong>Classification:</strong> ${escapeHtml(c.classification_method || 'keyword')} (${Number(c.classification_confidence || 0).toFixed(2)})</p>
          <p class="my-2 text-gray-800"><strong>Description:</strong> ${escapeHtml(c.description || '')}</p>
          <div class="mt-3 space-y-2">${getFileDisplay(c)}</div>

          <div class="mt-4 flex items-center gap-4">
            <label class="font-medium" for="status-${c.id}">Update Status:</label>
            <select class="p-2 border rounded" id="status-${c.id}">
              <option ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option ${c.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </div>

          <div class="mt-3">
            <label class="block font-medium mb-1" for="remark-${c.id}">Admin Remark:</label>
            <textarea class="w-full p-2 border rounded" placeholder="Enter your remark..." id="remark-${c.id}">${escapeHtml(c.remark || '')}</textarea>
            <button class="mt-2 px-4 py-1 bg-green-600 text-white rounded hover:bg-green-700" onclick="saveUpdate(${c.id})">Save</button>
          </div>
        </div>
      `;

      complaintsContainer.insertAdjacentHTML('beforeend', card);
    });
  } catch (error) {
    console.error('Failed to load complaints:', error);
    complaintsContainer.innerHTML = '<p class="text-red-500">Error loading complaints.</p>';
  }
}

async function loadDashboardCounts() {
  try {
    const res = await fetch(`${API_BASE}/admin/summary`);
    const data = await res.json();

    if (!res.ok || !data.success) {
      return;
    }

    document.getElementById('total-count').textContent = data.total || 0;
    document.getElementById('resolved-count').textContent = data.resolved || 0;
    document.getElementById('pending-count').textContent = data.pending || 0;
  } catch (error) {
    console.error('Error loading dashboard counts:', error);
  }
}

function isEditingFormField() {
  const active = document.activeElement;
  if (!active) return false;
  const tag = (active.tagName || '').toLowerCase();
  return tag === 'textarea' || tag === 'input' || tag === 'select';
}

async function refreshAdminData() {
  if (isEditingFormField()) {
    return;
  }
  await loadComplaints();
  await loadDashboardCounts();
}

function startAutoRefresh() {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => {
    refreshAdminData().catch((error) => {
      console.error('Auto-refresh failed:', error);
    });
  }, AUTO_REFRESH_MS);
}

function stopAutoRefresh() {
  if (!autoRefreshTimer) return;
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = null;
}

async function saveUpdate(id) {
  try {
    const status = document.getElementById(`status-${id}`).value;
    const remark = document.getElementById(`remark-${id}`).value;

    const res = await fetch(`${API_BASE}/admin/complaint/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, remark })
    });

    const result = await res.json();
    if (!res.ok || !result.success) {
      alert(result.message || `Failed to update complaint #${id}`);
      return;
    }

    alert(`Complaint #${id} updated successfully`);
    await loadComplaints();
    await loadDashboardCounts();
  } catch (error) {
    console.error('Update failed:', error);
    alert('Failed to update complaint due to network/server error.');
  }
}

applyFiltersBtn.addEventListener('click', async () => {
  await loadComplaints();
});

resetFiltersBtn.addEventListener('click', async () => {
  departmentFilter.value = '';
  statusFilter.value = '';
  await loadComplaints();
});

document.addEventListener('DOMContentLoaded', async () => {
  await loadDepartments();
  await loadComplaints();
  await loadDashboardCounts();
  startAutoRefresh();
});

window.addEventListener('beforeunload', stopAutoRefresh);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopAutoRefresh();
    return;
  }
  startAutoRefresh();
  refreshAdminData().catch((error) => {
    console.error('Refresh on visibility change failed:', error);
  });
});
</script>
</body>
</html>
